<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 500 560">
<defs>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#0891b2" stop-opacity=".38"/>
    <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="brain" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#67e8f9"/>
    <stop offset=".55" stop-color="#38bdf8"/>
    <stop offset="1" stop-color="#6366f1"/>
  </linearGradient>
  <filter id="softGlow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<ellipse cx="250" cy="280" rx="235" ry="245" fill="url(#glow)"/>

<g fill="none" stroke="url(#brain)"
stroke-width="2.6" stroke-linecap="round"
stroke-linejoin="round" filter="url(#softGlow)" opacity=".85">

